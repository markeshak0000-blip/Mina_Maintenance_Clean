<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="نظام إدارة مركز صيانة متكامل - نسخة نظيفة بدون بيانات إضافية">
<title>نظام إدارة الصيانة</title>
<style>
:root{
  --bg:#06100c;--panel:#0b1712;--panel2:#0e1d16;--line:#1d3027;--line2:#274238;
  --text:#f4f7f5;--muted:#93a59c;--green:#1fd18b;--green2:#0da968;
  --blue:#5ea8ff;--yellow:#f4c84d;--red:#ff6b6b;--purple:#b98cff;
  --shadow:0 14px 40px rgba(0,0,0,.28);--r:16px;
  --font: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);background:
 radial-gradient(circle at 8% 0%,rgba(31,209,139,.07),transparent 28%),
 radial-gradient(circle at 92% 0%,rgba(94,168,255,.05),transparent 24%),var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:18px;border-left:1px solid var(--line);background:rgba(6,16,12,.96);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;padding:8px 4px 14px;border-bottom:1px solid var(--line)}
.brand img{width:48px;height:48px;border-radius:14px;object-fit:contain;background:#fff0;padding:3px}
.brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#19d98d,#08784c);font-weight:900;color:#03110a}
.brand-title{font-weight:900;font-size:15px}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{border:1px solid transparent;background:transparent;color:#cbd5d0;text-align:right;padding:11px 12px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:.18s}
.nav button:hover{background:#ffffff06;border-color:#ffffff08}
.nav button.active{background:#0c2a1d;border-color:#1e5f43;color:#fff}
.nav .nav-left{display:flex;align-items:center;gap:10px}
.nav .key{font-size:10px;color:#6f8278;border:1px solid #294238;border-radius:6px;padding:2px 5px}
.sidebar-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:10px;line-height:1.7}
.sidebar-footer strong{color:#dce6e0}
.main{min-width:0}
.topbar{height:72px;position:sticky;top:0;z-index:20;background:rgba(6,16,12,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 18px}
.searchbox{flex:1;max-width:760px;display:flex;align-items:center;gap:8px;background:#09150f;border:1px solid var(--line2);padding:0 12px;border-radius:13px}
.searchbox input{width:100%;height:44px;border:0;outline:0;background:transparent;color:var(--text)}
.top-actions{margin-inline-start:auto;display:flex;gap:8px}
.icon-btn,.ghost,.primary,.danger,.warn{border:1px solid var(--line2);background:#0b1712;color:#dbe6e0;min-height:42px;padding:0 13px;border-radius:11px}
.icon-btn{width:42px;padding:0;display:grid;place-items:center}
.primary{background:linear-gradient(135deg,#10b979,#0b915f);border-color:#1fd18b;color:#03110a;font-weight:900}
.danger{background:#2a1010;border-color:#5f2323;color:#ffb1b1}
.warn{background:#2a210b;border-color:#634d16;color:#ffe18b}
.ghost:hover,.icon-btn:hover{background:#11231a}
.content{padding:20px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.page-title{font-size:22px;font-weight:900;margin:0}
.page-sub{margin:4px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:linear-gradient(180deg,#0c1913,#09140f);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi{padding:16px;min-height:122px;display:flex;flex-direction:column;justify-content:space-between}
.kpi .label{font-size:11px;color:var(--muted)}
.kpi .value{font-size:25px;font-weight:900;letter-spacing:.2px}
.kpi .meta{font-size:10px;color:#789088}
.accent-green{border-color:#1b4f39}.accent-blue{border-color:#21486d}.accent-yellow{border-color:#5d4b1b}.accent-red{border-color:#5d2525}.accent-purple{border-color:#473269}
.two-col{grid-template-columns:1.35fr .95fr}
.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{padding:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-title{font-size:14px;font-weight:900;margin:0}.panel-sub{font-size:10px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.list-row{border:1px solid #183027;background:#09140f;border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.list-row .main-t{font-size:12px;font-weight:800}.list-row .sub{font-size:10px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;border:1px solid}
.b-green{background:#0b2a1d;border-color:#1c6143;color:#7df3bb}
.b-blue{background:#0b1f33;border-color:#214e7a;color:#a8d2ff}
.b-yellow{background:#2b220c;border-color:#614d17;color:#ffe58e}
.b-red{background:#2b1111;border-color:#642525;color:#ffadad}
.b-gray{background:#171d1a;border-color:#33443d;color:#bcc7c2}.b-purple{background:#241634;border-color:#51347b;color:#d1b7ff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;color:#8ea097}
.field input,.field select,.field textarea,.inline-input{background:#07110d;border:1px solid var(--line2);border-radius:10px;outline:none;color:var(--text);padding:10px 11px}
.field input:focus,.field select:focus,.field textarea:focus,.inline-input:focus{border-color:#2aa875;box-shadow:0 0 0 3px #2aa87515}
.field textarea{min-height:90px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 11px;border-bottom:1px solid #173027;text-align:right;font-size:11px;vertical-align:middle}
th{background:#0b1812;color:#94a79d;font-weight:800;position:sticky;top:0;z-index:1}
tbody tr{transition:.15s}
tbody tr:hover{background:#0d2118}
tbody tr.selected{background:#0c2b1d;outline:1px solid #23684a;outline-offset:-1px}
.actions-cell{display:flex;gap:5px;justify-content:flex-start;flex-wrap:wrap}
.small-btn{height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line2);background:#0e1c15;color:#d7e2dd;font-size:10px}
.empty{padding:34px 18px;text-align:center;border:1px dashed #284038;border-radius:14px;color:#72847b}
.empty strong{display:block;color:#bbc9c2;margin-bottom:5px}
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#09140f}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:var(--muted)}
.progress{height:7px;border-radius:999px;background:#13231c;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#0ea969,#28dc95)}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.show{display:flex}
.modal{width:min(840px,100%);max-height:92vh;overflow:auto;background:#0b1712;border:1px solid #29493b;border-radius:18px;box-shadow:0 30px 90px #000c}
.modal-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;top:0;background:#0b1712;z-index:2}
.modal-body{padding:17px}
.modal-foot{padding:13px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-start;gap:8px;position:sticky;bottom:0;background:#0b1712}
.notice{padding:11px 12px;border:1px solid #31533f;background:#0b2118;border-radius:11px;font-size:10px;color:#a9c8ba}
.command-list{display:flex;flex-direction:column;gap:5px}.command{width:100%;border:1px solid transparent;background:#09140f;border-radius:10px;color:#dfe8e3;padding:10px;text-align:right;display:flex;justify-content:space-between;gap:12px}.command:hover,.command.focused{background:#0c2a1d;border-color:#245a42}
.kbd{font-size:9px;color:#8ea399;border:1px solid #31463d;background:#0b1712;padding:3px 6px;border-radius:6px;white-space:nowrap}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(420px,calc(100% - 30px))}
.toast{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #285a42;background:#0b2118;box-shadow:var(--shadow);font-size:11px;animation:toastIn .2s ease}
.toast.err{border-color:#6a2d2d;background:#291111}.toast.warn{border-color:#69531d;background:#2a210b}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shortcut{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#09140f}
.shortcut span{font-size:11px}.shortcut kbd{font-size:10px;color:#9fb2a8;border:1px solid #30463b;padding:3px 7px;border-radius:6px;background:#0c1711}
.footer{padding:18px 20px;border-top:1px solid var(--line);margin-top:20px;color:#6e8178;font-size:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mobile-nav{display:none}
.print-only{display:none}
@media(max-width:1150px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two-col{grid-template-columns:1fr}
}
@media(max-width:850px){
  .app{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:#08120d;border-top:1px solid var(--line);padding:8px;gap:6px;overflow:auto}.mobile-nav button{min-width:75px;background:#0c1a13;border:1px solid var(--line);color:#b8c6bf;border-radius:10px;padding:8px;font-size:9px}.mobile-nav button.active{color:#fff;background:#0c2a1d;border-color:#236548}.content{padding-bottom:88px}.topbar{padding-inline:10px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.three-col{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.shortcuts{grid-template-columns:1fr}
}
@media(max-width:520px){.kpis{grid-template-columns:1fr}.page-head{flex-direction:column}.actions{width:100%}.actions button{flex:1}.top-actions .ghost{display:none}.content{padding:12px}.panel{padding:12px}}
@media print{
  body{background:#fff;color:#000}.sidebar,.topbar,.mobile-nav,.page-head,.footer,.no-print{display:none!important}.app{display:block}.content{padding:0}.card{box-shadow:none;border:0;background:#fff}.print-only{display:block}
  table{min-width:0}th,td{color:#000;background:#fff;border-color:#ccc;font-size:9px}.panel{border:1px solid #ddd}.badge{color:#000!important;background:#eee!important;border-color:#999!important}
}
</style>
</head>
<body>
<div id="app"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
(() => {
"use strict";

const STORAGE_KEY = "infinity_mina_maintenance_v7";
const DEV = {
  nameEn: "ENG. Mark Eshak",
  nameAr: "المهندس مارك اسحق",
  brand: "Infinity MEN2",
  role: "Software Engineer",
  description: "تطوير هندسة البرمجيات وأنظمة سطح المكتب المتكاملة لإدارة الأعمال.",
  label: "Mark Eshak | Infinity MEN2- برمجة وتصميم",
  linktree: "https://linktr.ee/markeshak",
  portfolio: "https://markeshak00000.github.io/portfolio/"
};

const defaultState = {
  settings: {
    businessName: "",
    businessAddress: "",
    businessPhone: "",
    businessWhatsApp: "",
    currency: "جنيه",
    printerWidth: "80mm",
    warrantyDefault: 30,
    invoiceFooter: ""
  },
  customers: [],
  devices: [],
  parts: [],
  suppliers: [],
  transactions: [],
  documents: [],
  activity: []
};

let state = loadState();
let currentPage = "dashboard";
let selected = {
  customers: -1, devices: -1, parts: -1, suppliers: -1, transactions: -1
};
let filters = {
  global: "",
  devices: {search:"",status:"all",type:"all",from:"",to:""},
  customers: {search:"",level:"all"},
  parts: {search:"",stock:"all"},
  suppliers: {search:""},
  finance: {from:"",to:"",type:"all"},
  reports: {from:"",to:""}
};
let commandIndex = 0;
let commandItems = [];

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(defaultState);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(defaultState),
      ...parsed,
      settings:{...defaultState.settings,...(parsed.settings||{})},
      customers:Array.isArray(parsed.customers)?parsed.customers:[],
      devices:Array.isArray(parsed.devices)?parsed.devices:[],
      parts:Array.isArray(parsed.parts)?parsed.parts:[],
      suppliers:Array.isArray(parsed.suppliers)?parsed.suppliers:[],
      transactions:Array.isArray(parsed.transactions)?parsed.transactions:[],
      documents:Array.isArray(parsed.documents)?parsed.documents:[],
      activity:Array.isArray(parsed.activity)?parsed.activity:[]
    };
  }catch(e){ return structuredClone(defaultState); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function uid(prefix){
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function today(){
  const d=new Date();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${m}-${day}`;
}
function nowISO(){ return new Date().toISOString(); }
function fmtMoney(v){
  const n=Number(v||0);
  return new Intl.NumberFormat("ar-EG",{maximumFractionDigits:2,minimumFractionDigits:0}).format(n) + " " + (state.settings.currency||"جنيه");
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function safeNum(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
function textSearch(obj,q){
  if(!q) return true;
  const s=q.toLowerCase();
  return JSON.stringify(obj).toLowerCase().includes(s);
}
function getCustomer(id){ return state.customers.find(x=>x.id===id); }
function getSupplier(id){ return state.suppliers.find(x=>x.id===id); }
function deviceBalance(d){ return Math.max(0,safeNum(d.cost)-safeNum(d.paid)); }
function warrantyExpiry(d){
  if(!d.receivedDate || !safeNum(d.warrantyDays)) return "";
  const x=new Date(d.receivedDate+"T12:00:00");
  x.setDate(x.getDate()+safeNum(d.warrantyDays));
  return x.toISOString().slice(0,10);
}
function statusClass(s){
  return s==="تم التسليم"?"b-green":s==="جاهز"?"b-blue":s==="متأخر"?"b-red":s==="في الانتظار"?"b-yellow":"b-gray";
}
function stockClass(p){
  const stock=safeNum(p.stock), min=safeNum(p.minStock);
  return stock<=0?"b-red":stock<=min?"b-yellow":"b-green";
}
function recordActivity(text){
  state.activity.unshift({id:uid("A"),text,time:nowISO()});
  state.activity=state.activity.slice(0,60);
  saveState();
}
function toast(msg,type=""){
  const el=document.createElement("div");
  el.className="toast "+type;
  el.textContent=msg;
  document.getElementById("toastWrap").appendChild(el);
  setTimeout(()=>el.remove(),2800);
}
function confirmAction(message){
  return window.confirm(message);
}
function openModal(title,body,footer=""){
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="modal-head"><div><div class="panel-title">${escapeHtml(title)}</div></div><button class="icon-btn" data-close-modal>✕</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:""}`;
  document.getElementById("modalBackdrop").classList.add("show");
}
function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("show");
  document.getElementById("modal").innerHTML="";
}
document.getElementById("modalBackdrop").addEventListener("click",e=>{ if(e.target.id==="modalBackdrop") closeModal(); });
document.addEventListener("click",e=>{ if(e.target.closest("[data-close-modal]")) closeModal(); });

function navItems(){
  return [
    ["dashboard","لوحة التحكم","Ctrl+1"],
    ["devices","الأجهزة","Ctrl+2"],
    ["customers","العملاء","Ctrl+3"],
    ["parts","قطع الغيار","Ctrl+4"],
    ["suppliers","الموردون","Ctrl+5"],
    ["finance","المالية","Ctrl+6"],
    ["documents","المستندات","Ctrl+7"],
    ["reports","التقارير","Ctrl+8"],
    ["settings","الإعدادات",""]
  ];
}
function navHtml(){
  return navItems().map(([id,label,key])=>`
    <button class="${currentPage===id?"active":""}" data-page="${id}">
      <span class="nav-left"><span>${iconFor(id)}</span><span>${label}</span></span>
      ${key?`<span class="key">${key}</span>`:""}
    </button>`).join("");
}
function iconFor(id){
  const icons={
    dashboard:"◈",devices:"▦",customers:"◎",parts:"◫",suppliers:"♧",
    finance:"▤",documents:"▤",reports:"◭",settings:"⚙"
  };
  return icons[id]||"•";
}
function mobileNavHtml(){
  return navItems().map(([id,label])=>`<button class="${currentPage===id?"active":""}" data-page="${id}">${iconFor(id)}<br>${label}</button>`).join("");
}

function layout(content){
  const s=state.settings;
  document.getElementById("app").innerHTML=`
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/images/logo.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
        <div class="brand-mark" style="display:none">IM</div>
        <div><div class="brand-title">${escapeHtml(s.businessName||"نظام إدارة الصيانة")}</div><div class="brand-sub">نسخة تشغيل فعلية • بياناتك فقط</div></div>
      </div>
      <nav class="nav">${navHtml()}</nav>
      <button class="ghost" id="openShortcuts">⌨ الاختصارات</button>
      <div class="sidebar-footer">
        <strong>${escapeHtml(DEV.nameEn)}</strong><br>
        ${escapeHtml(DEV.role)} • ${escapeHtml(DEV.brand)}<br>
        <a href="${DEV.linktree}" target="_blank" rel="noopener">Linktree</a> •
        <a href="${DEV.portfolio}" target="_blank" rel="noopener">Portfolio</a>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="searchbox">⌕ <input id="globalSearch" value="${escapeHtml(filters.global)}" placeholder="بحث شامل: عميل، جهاز، سيريال، باركود، مستند..." autocomplete="off"></div>
        <div class="top-actions">
          <button class="ghost" id="commandBtn">Ctrl+K</button>
          <button class="icon-btn" id="refreshBtn" title="تحديث">↻</button>
        </div>
      </header>
      <section class="content">${content}</section>
      <footer class="footer"><span>${escapeHtml(DEV.label)}</span><span>${escapeHtml(DEV.description)}</span></footer>
    </main>
  </div>
  <nav class="mobile-nav">${mobileNavHtml()}<button id="openShortcutsMobile">⌨<br>اختصارات</button></nav>`;
  bindCommon();
}

function bindCommon(){
  document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.page)));
  document.getElementById("commandBtn")?.addEventListener("click",openCommandPalette);
  document.getElementById("openShortcuts")?.addEventListener("click",showShortcuts);
  document.getElementById("openShortcutsMobile")?.addEventListener("click",showShortcuts);
  document.getElementById("refreshBtn")?.addEventListener("click",()=>{saveState(); render(); toast("تم تحديث البيانات");});
  const g=document.getElementById("globalSearch");
  g?.addEventListener("input",e=>{filters.global=e.target.value;});
  g?.addEventListener("keydown",e=>{ if(e.key==="Enter" && filters.global.trim()){navigate("devices");filters.devices.search=filters.global.trim();render();}});
}

function navigate(page){
  currentPage=page;
  render();
}

function render(){
  let content="";
  if(currentPage==="dashboard") content=renderDashboard();
  if(currentPage==="devices") content=renderDevices();
  if(currentPage==="customers") content=renderCustomers();
  if(currentPage==="parts") content=renderParts();
  if(currentPage==="suppliers") content=renderSuppliers();
  if(currentPage==="finance") content=renderFinance();
  if(currentPage==="documents") content=renderDocuments();
  if(currentPage==="reports") content=renderReports();
  if(currentPage==="settings") content=renderSettings();
  layout(content);
  bindPage();
}

function bindPage(){
  document.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",handleAction));
  // Escape barcode input into parts search quickly
  const barcode=document.getElementById("barcodeQuick");
  if(barcode) barcode.focus();
}

function handleAction(e){
  const a=e.currentTarget.dataset.action;
  const id=e.currentTarget.dataset.id;
  if(a==="new-device") openDeviceForm();
  if(a==="edit-device") openDeviceForm(id);
  if(a==="delete-device") deleteDevice(id);
  if(a==="new-customer") openCustomerForm();
  if(a==="edit-customer") openCustomerForm(id);
  if(a==="delete-customer") deleteCustomer(id);
  if(a==="new-part") openPartForm();
  if(a==="edit-part") openPartForm(id);
  if(a==="delete-part") deletePart(id);
  if(a==="new-supplier") openSupplierForm();
  if(a==="edit-supplier") openSupplierForm(id);
  if(a==="delete-supplier") deleteSupplier(id);
  if(a==="new-transaction") openTransactionForm();
  if(a==="delete-transaction") deleteTransaction(id);
  if(a==="print-device") printDevice(id);
  if(a==="whatsapp-device") whatsappDevice(id);
  if(a==="doc-device") createDeviceDocument(id);
  if(a==="part-stock-in") stockMovement(id,"in");
  if(a==="part-stock-out") stockMovement(id,"out");
  if(a==="close-day") dailyClose();
  if(a==="backup") backupJson();
  if(a==="restore") document.getElementById("restoreFile")?.click();
  if(a==="export-customers") exportCSV(state.customers,"customers.csv",["id","name","phone","level","points","notes"]);
  if(a==="export-devices") exportCSV(state.devices,"devices.csv",["id","customerName","type","brand","model","serial","status","cost","paid","receivedDate","estimatedDate"]);
  if(a==="export-parts") exportCSV(state.parts,"parts.csv",["id","name","barcode","stock","minStock","buyPrice","sellPrice","location","supplierId"]);
  if(a==="export-transactions") exportCSV(state.transactions,"transactions.csv",["id","date","type","category","amount","method","note"]);
}

function statusSummary(){
  const rows=["في الانتظار","قيد الصيانة","جاهز","متأخر","تم التسليم"];
  const total=Math.max(state.devices.length,1);
  return rows.map(s=>{
    const n=state.devices.filter(d=>d.status===s).length;
    return `<div class="list-row"><div><div class="main-t">${s}</div><div class="sub">${n} جهاز</div></div><span class="progress" style="width:150px"><i style="width:${Math.round(n/total*100)}%"></i></span></div>`;
  }).join("");
}
function alertsHtml(){
  const alerts=[];
  const low=state.parts.filter(p=>safeNum(p.stock)<=safeNum(p.minStock));
  const overdue=state.devices.filter(d=>d.status==="متأخر");
  if(overdue.length) alerts.push(`<div class="list-row"><div><div class="main-t">أجهزة متأخرة</div><div class="sub">${overdue.length} جهاز يحتاج متابعة</div></div><span class="badge b-red">متابعة</span></div>`);
  if(low.length) alerts.push(`<div class="list-row"><div><div class="main-t">مخزون منخفض</div><div class="sub">${low.length} قطعة عند/تحت الحد</div></div><span class="badge b-yellow">مخزون</span></div>`);
  const unpaid=state.devices.filter(d=>deviceBalance(d)>0&&d.status==="جاهز").length;
  if(unpaid) alerts.push(`<div class="list-row"><div><div class="main-t">أجهزة جاهزة وبها باقي</div><div class="sub">${unpaid} جهاز</div></div><span class="badge b-blue">تحصيل</span></div>`);
  if(!alerts.length) return `<div class="empty"><strong>لا توجد تنبيهات</strong>النظام لا يحتوي حاليًا على حالات تستدعي إجراءً.</div>`;
  return `<div class="list">${alerts.join("")}</div>`;
}

      <div class="field"><label>التكلفة الإجمالية</label><input id="dev_cost" type="number" min="0" step="0.01" value="${safeNum(d?.cost)}"></div>

      <div class="field full"><label>وصف العطل / المطلوب</label><textarea id="dev_problem" placeholder="اكتب الوصف الحقيقي للجهاز أو العطل">${escapeHtml(d?.problem||"")}</textarea></div>
      <div class="field full"><label>ملاحظات داخلية</label><textarea id="dev_internal">${escapeHtml(d?.internalNotes||"")}</textarea></div>
      <div class="field full"><label>ملاحظات للعميل</label><textarea id="dev_customerNotes">${escapeHtml(d?.customerNotes||"")}</textarea></div>
    </div>
    <div class="notice" style="margin-top:12px">السيريال يجب أن يكون فريدًا. الدفع الجديد فقط يُضاف كدخل مالي عند حفظ السجل؛ تعديل بيانات الجهاز لا يكرر الدفعات القديمة.</div>
  `,`<button class="ghost" data-close-modal>إلغاء</button><button class="primary" id="saveDevice">${d?"حفظ التعديل":"حفظ الجهاز"}</button>`);

    const payload={
      customerId:val("dev_customer"),
      customerName:val("dev_customerName").trim(),
      type:val("dev_type"),brand:val("dev_brand").trim(),model:val("dev_model").trim(),
      serial:val("dev_serial").trim(),imei:val("dev_imei").trim(),condition:val("dev_condition"),
      priority:val("dev_priority"),status:val("dev_status"),receivedDate:val("dev_received"),
      estimatedDate:val("dev_estimated"),warrantyDays:safeNum(val("dev_warranty")),cost:safeNum(val("dev_cost")),
      paid:safeNum(val("dev_paid")),paymentMethod:val("dev_method"),problem:val("dev_problem"),
      internalNotes:val("dev_internal"),customerNotes:val("dev_customerNotes")
    };
    if(!payload.serial){toast("السيريال مطلوب","err");return;}
    if(state.devices.some(x=>x.serial&&x.serial.toLowerCase()===payload.serial.toLowerCase()&&x.id!==deviceId)){toast("السيريال مستخدم في جهاز آخر","err");return;}
    if(payload.customerId){
      const cc=getCustomer(payload.customerId); if(cc) payload.customerName=cc.name;
    }
    if(payload.paid>payload.cost){toast("المدفوع لا يمكن أن يتجاوز التكلفة","err");return;}
    const old=d?state.devices.find(x=>x.id===deviceId):null;
    if(d){
      const delta=safeNum(payload.paid)-safeNum(old?.paid);
      Object.assign(d,payload, {updatedAt:nowISO(),warrantyExpiry:warrantyExpiry({...d,...payload})});
      if(delta>0) addFinance("income","دفعة جهاز",delta,payload.paymentMethod,"دفعة إضافية للجهاز "+d.serial);
      if(delta<0) addFinance("expense","رد مبلغ",-delta,payload.paymentMethod,"استرداد من الجهاز "+d.serial);
      recordActivity(`تم تعديل الجهاز ${payload.serial}`);
      toast("تم حفظ تعديل الجهاز");
    }else{
      const nd={id:uid("D"),...payload,createdAt:nowISO(),warrantyExpiry:warrantyExpiry(payload)};
      state.devices.push(nd);
      if(payload.paid>0) addFinance("income","دفعة جهاز",payload.paid,payload.paymentMethod,"دفعة أولى للجهاز "+payload.serial);
      recordActivity(`تم تسجيل جهاز ${payload.serial}`);
      toast("تم تسجيل الجهاز");
    }
    saveState();closeModal();render();
  };
}

function stockMovement(id,type){
  const p=state.parts.find(x=>x.id===id);if(!p)return;
  openModal(type==="in"?"إضافة مخزون":"سحب من المخزون",`
    <div class="field"><label>الكمية</label><input id="move_qty" type="number" min="1" step="1" value="1"></div>
    <div class="field" style="margin-top:12px"><label>السبب / البيان</label><input id="move_note" value="${type==="in"?"شراء مخزون":"استخدام/بيع"}"></div>`,
    `<button class="ghost" data-close-modal>إلغاء</button><button class="primary" id="saveMove">تأكيد</button>`);
  document.getElementById("saveMove").onclick=()=>{
    const q=Math.floor(safeNum(val("move_qty")));
    if(q<1){toast("أدخل كمية صحيحة","err");return;}
    if(type==="out"&&safeNum(p.stock)<q){toast("الكمية المطلوبة أكبر من المخزون","err");return;}

    recordActivity(`${type==="in"?"إضافة":"سحب"} مخزون: ${p.name} × ${q}`);
    saveState();closeModal();render();toast("تم تحديث المخزون");
  };
}

  if(state.parts.some(p=>p.supplierId===id)){toast("لا يمكن حذف المورد لأنه مرتبط بقطع غيار","err");return;}

  state.suppliers=state.suppliers.filter(x=>x.id!==id);saveState();recordActivity(`تم حذف المورد ${s.name}`);render();toast("تم حذف المورد");
}

function openTransactionForm(){
  openModal("عملية مالية جديدة",`
  <div class="form-grid">
    <div class="field"><label>النوع</label><select id="tx_type"><option value="income">دخل</option><option value="expense">مصروف</option></select></div>
    <div class="field"><label>التاريخ</label><input id="tx_date" type="date" value="${today()}"></div>
    <div class="field"><label>التصنيف</label><input id="tx_category" placeholder="اكتب التصنيف"></div>
    <div class="field"><label>المبلغ</label><input id="tx_amount" type="number" min="0" step="0.01"></div>
    <div class="field"><label>طريقة الدفع</label><select id="tx_method">${["كاش","فودافون كاش","إنستا باي","تحويل بنكي","تقسيط"].map(x=>`<option>${x}</option>`).join("")}</select></div>
    <div class="field"><label>البيان</label><input id="tx_note"></div>
  </div>`,
  `<button class="ghost" data-close-modal>إلغاء</button><button class="primary" id="saveTx">حفظ العملية</button>`);
  document.getElementById("saveTx").onclick=()=>{
    const amount=safeNum(val("tx_amount"));
    if(amount<=0){toast("أدخل مبلغًا صحيحًا","err");return;}
    addFinance(val("tx_type"),val("tx_category").trim()||"عام",amount,val("tx_method"),val("tx_note").trim(),val("tx_date"));
    closeModal();render();toast("تم تسجيل العملية");
  };
}
function addFinance(type,category,amount,method,note,date=today()){
  state.transactions.push({id:uid("T"),date,type,category,amount:safeNum(amount),method,note,createdAt:nowISO()});
  recordActivity(`${type==="income"?"دخل":"مصروف"} ${fmtMoney(amount)} • ${category}`);
  saveState();
}
function deleteTransaction(id){
  const t=state.transactions.find(x=>x.id===id);if(!t)return;
  if(!confirmAction("حذف العملية المالية؟"))return;
  state.transactions=state.transactions.filter(x=>x.id!==id);saveState();recordActivity(`تم حذف عملية مالية ${fmtMoney(t.amount)}`);render();toast("تم حذف العملية");
}
function dailyClose(){
  const d=today(), rows=state.transactions.filter(x=>x.date===d);
  const income=rows.filter(x=>x.type==="income").reduce((a,b)=>a+safeNum(b.amount),0);
  const expense=rows.filter(x=>x.type==="expense").reduce((a,b)=>a+safeNum(b.amount),0);
  openModal("إغلاق اليوم",`<div class="stat-strip"><div class="stat"><b>${fmtMoney(income)}</b><span>دخل اليوم</span></div><div class="stat"><b>${fmtMoney(expense)}</b><span>مصروف اليوم</span></div><div class="stat"><b>${fmtMoney(income-expense)}</b><span>صافي اليوم</span></div><div class="stat"><b>${rows.length}</b><span>عدد العمليات</span></div></div><div class="notice" style="margin-top:12px">يمكنك طباعة تقرير الإغلاق من نافذة الطباعة في التقارير.</div>`,
    `<button class="ghost" data-close-modal>إغلاق</button><button class="primary" id="printClose">طباعة</button>`);
  document.getElementById("printClose").onclick=()=>{closeModal();printDailyClose(d,income,expense,rows.length)};
}

function printDocument(id){
  const d=state.documents.find(x=>x.id===id);if(!d)return;
  printHtml(d.html);
}
function createDeviceDocument(id){
  const d=state.devices.find(x=>x.id===id);if(!d)return;
  const c=getCustomer(d.customerId);
  const num="DOC-"+Date.now().toString(36).toUpperCase();
  const html=devicePrintableHtml(d,c,num);
  state.documents.push({id:uid("DOC"),title:"مستند جهاز • "+(d.serial||d.id),number:num,createdAt:nowISO(),deviceId:id,html});
  saveState();recordActivity(`تم إنشاء مستند ${num}`);render();printHtml(html);
}
function printDevice(id){
  const d=state.devices.find(x=>x.id===id);if(!d)return;
  const c=getCustomer(d.customerId);
  printHtml(devicePrintableHtml(d,c,""));
}
function printDailyClose(date,income,expense,count){
  const html=`
  <html dir="rtl"><head><meta charset="utf-8"><style>${printCss()}</style></head><body>
  <div class="sheet"><h1>${escapeHtml(state.settings.businessName||"تقرير إغلاق اليوم")}</h1><div>${date}</div>
  <hr><table><tr><th>البيان</th><th>القيمة</th></tr><tr><td>إجمالي الدخل</td><td>${fmtMoney(income)}</td></tr><tr><td>إجمالي المصروف</td><td>${fmtMoney(expense)}</td></tr><tr><td>الصافي</td><td>${fmtMoney(income-expense)}</td></tr><tr><td>عدد العمليات</td><td>${count}</td></tr></table>
  <div class="footerline">${escapeHtml(state.settings.invoiceFooter||DEV.label)}</div></div></body></html>`;
  printHtml(html);
}
function printHtml(inner){
  const w=window.open("","_blank","width=900,height=760");
  if(!w){toast("المتصفح منع نافذة الطباعة. اسمح بالنوافذ المنبثقة.","err");return;}
  w.document.write(inner);w.document.close();setTimeout(()=>{w.focus();w.print();},350);
}
function printCss(){
  const width=state.settings.printerWidth||"80mm";
  const sheetWidth=width==="A4"?"210mm":width;
  return `@page{size:${sheetWidth} auto;margin:6mm}body{font-family:Arial,Tahoma,sans-serif;color:#111;margin:0}.sheet{width:${width==="A4"?"190mm":width};max-width:100%;margin:auto}h1{font-size:20px;margin:0 0 8px}.center{text-align:center}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:7px;text-align:right;font-size:12px}.footerline{margin-top:18px;padding-top:8px;border-top:1px solid #ddd;font-size:10px;color:#555}`;
}
function devicePrintableHtml(d,c,num){
  const s=state.settings;
  return `<html dir="rtl"><head><meta charset="utf-8"><style>${printCss()}</style></head><body>
  <div class="sheet">
    <div class="center"><h1>${escapeHtml(s.businessName||"نظام إدارة الصيانة")}</h1><div>${escapeHtml(s.businessAddress||"")}</div><div>${escapeHtml(s.businessPhone||"")}</div></div>
    <hr>
    ${num?`<div><b>رقم المستند:</b> ${escapeHtml(num)}</div>`:""}
    <div><b>التاريخ:</b> ${today()}</div>
    <table>
      <tr><th>العميل</th><td>${escapeHtml(c?.name||d.customerName||"—")}</td></tr>
      <tr><th>الموبايل</th><td>${escapeHtml(c?.phone||"—")}</td></tr>
      <tr><th>الجهاز</th><td>${escapeHtml([d.brand,d.model].filter(Boolean).join(" ")||d.type)}</td></tr>
      <tr><th>السيريال</th><td>${escapeHtml(d.serial||"—")}</td></tr>
      <tr><th>الحالة</th><td>${escapeHtml(d.status||"—")}</td></tr>
      <tr><th>العطل</th><td>${escapeHtml(d.problem||"—")}</td></tr>
      <tr><th>التكلفة</th><td>${fmtMoney(d.cost)}</td></tr>
      <tr><th>المدفوع</th><td>${fmtMoney(d.paid)}</td></tr>
      <tr><th>المتبقي</th><td>${fmtMoney(deviceBalance(d))}</td></tr>
      <tr><th>الضمان حتى</th><td>${escapeHtml(d.warrantyExpiry||"—")}</td></tr>
    </table>
    <div class="footerline">${escapeHtml(s.invoiceFooter||"")}</div>
  </div></body></html>`;
}
function whatsappDevice(id){
  const d=state.devices.find(x=>x.id===id);if(!d)return;
  const c=getCustomer(d.customerId);
  const phone=(c?.phone||"").replace(/\D/g,"");
  if(!phone){toast("لا يوجد رقم واتساب صالح للعميل","err");return;}
  const msg=`مرحبًا ${c?.name||d.customerName||""}
حالة الجهاز: ${d.status}
الجهاز: ${[d.brand,d.model].filter(Boolean).join(" ")||d.type}
السيريال: ${d.serial||""}
المتبقي: ${fmtMoney(deviceBalance(d))}
`;
  window.open("https://wa.me/2"+phone+"?text="+encodeURIComponent(msg),"_blank","noopener");
}

function showShortcuts(){
  const items=[
    ["لوحة التحكم","Ctrl+1"],["الأجهزة","Ctrl+2"],["العملاء","Ctrl+3"],["قطع الغيار","Ctrl+4"],["الموردون","Ctrl+5"],["المالية","Ctrl+6"],["المستندات","Ctrl+7"],["التقارير","Ctrl+8"],
    ["إضافة جهاز","Ctrl+N"],["إضافة عميل","Ctrl+Shift+C"],["إضافة قطعة","Ctrl+Shift+P"],["إضافة مورد","Ctrl+Shift+S"],["بحث شامل","Ctrl+F"],["الأوامر السريعة","Ctrl+K"],["طباعة","Ctrl+P"],["إغلاق نافذة","Esc"],["السجل السابق","↑"],["السجل التالي","↓"],["تعديل السجل المحدد","Enter"],["حذف السجل المحدد","Delete"]
  ];
  openModal("اختصارات النظام",`<div class="shortcuts">${items.map(([a,k])=>`<div class="shortcut"><span>${a}</span><kbd>${k}</kbd></div>`).join("")}</div><div class="notice" style="margin-top:12px">أسهم ↑ ↓ تعمل داخل القوائم عندما لا يكون المؤشر داخل خانة كتابة. قارئ الباركود يمكنه الكتابة في خانة ماسح الباركود ثم إرسال Enter.</div>`);
}

function commands(){
  return [
    ["اذهب للوحة التحكم","Ctrl+1",()=>navigate("dashboard")],
    ["افتح الأجهزة","Ctrl+2",()=>navigate("devices")],
    ["افتح العملاء","Ctrl+3",()=>navigate("customers")],
    ["افتح قطع الغيار","Ctrl+4",()=>navigate("parts")],
    ["افتح الموردين","Ctrl+5",()=>navigate("suppliers")],
    ["افتح المالية","Ctrl+6",()=>navigate("finance")],
    ["افتح المستندات","Ctrl+7",()=>navigate("documents")],
    ["افتح التقارير","Ctrl+8",()=>navigate("reports")],
    ["افتح الإعدادات","",()=>navigate("settings")],
    ["جهاز جديد","Ctrl+N",()=>openDeviceForm()],
    ["عميل جديد","Ctrl+Shift+C",()=>openCustomerForm()],
    ["قطعة جديدة","Ctrl+Shift+P",()=>openPartForm()],
    ["مورد جديد","Ctrl+Shift+S",()=>openSupplierForm()],
    ["اختصارات الكيبورد","",()=>showShortcuts()],
    ["تصدير نسخة JSON","",()=>backupJson()]
  ];
}
function openCommandPalette(){
  commandItems=commands();
  commandIndex=0;
  openModal("الأوامر السريعة",`
    <div class="field"><input id="commandSearch" placeholder="اكتب اسم الأمر..." autofocus></div>
    <div class="command-list" id="commandList" style="margin-top:10px"></div>`);
  const input=document.getElementById("commandSearch");
  input.addEventListener("input",renderCommands);
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();commandIndex=Math.min(commandIndex+1,filteredCommands().length-1);renderCommands();}
    else if(e.key==="ArrowUp"){e.preventDefault();commandIndex=Math.max(commandIndex-1,0);renderCommands();}
    else if(e.key==="Enter"){e.preventDefault();const x=filteredCommands()[commandIndex];if(x){closeModal();x[2]();}}
  });
  renderCommands();setTimeout(()=>input.focus(),30);
}
function filteredCommands(){
  const q=(document.getElementById("commandSearch")?.value||"").toLowerCase();
  return commandItems.filter(x=>x[0].toLowerCase().includes(q));
}
function renderCommands(){
  const list=document.getElementById("commandList"); if(!list)return;
  const arr=filteredCommands();
  if(commandIndex>=arr.length) commandIndex=Math.max(0,arr.length-1);
  list.innerHTML=arr.map((x,i)=>`<button class="command ${i===commandIndex?"focused":""}" data-cmd="${i}"><span>${escapeHtml(x[0])}</span><span class="kbd">${escapeHtml(x[1])}</span></button>`).join("");
  list.querySelectorAll("[data-cmd]").forEach((b,i)=>b.onclick=()=>{const x=arr[i];closeModal();x[2]();});
}

function backupJson(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json;charset=utf-8"});
  downloadBlob(blob,`maintenance-backup-${today()}.json`);
  toast("تم إنشاء النسخة الاحتياطية");
}
function downloadBlob(blob,name){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),800);
}
function exportCSV(rows,name,keys){
  const lines=[keys.join(",")].concat(rows.map(r=>keys.map(k=>csvCell(r?.[k])).join(",")));
  downloadBlob(new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"}),name);
  toast("تم التصدير");
}
function csvCell(v){return `"${String(v??"").replace(/"/g,'""')}"`;}

document.addEventListener("change",e=>{
  if(e.target.id==="deviceSearch"){filters.devices.search=e.target.value;render();}
  if(e.target.id==="deviceStatus"){filters.devices.status=e.target.value;render();}
  if(e.target.id==="deviceType"){filters.devices.type=e.target.value;render();}
  if(e.target.id==="deviceFrom"){filters.devices.from=e.target.value;render();}
  if(e.target.id==="deviceTo"){filters.devices.to=e.target.value;render();}
  if(e.target.id==="customerSearch"){filters.customers.search=e.target.value;render();}
  if(e.target.id==="customerLevel"){filters.customers.level=e.target.value;render();}
  if(e.target.id==="partSearch"){filters.parts.search=e.target.value;render();}
  if(e.target.id==="partStock"){filters.parts.stock=e.target.value;render();}
  if(e.target.id==="supplierSearch"){filters.suppliers.search=e.target.value;render();}
  if(e.target.id==="financeFrom"){filters.finance.from=e.target.value;render();}
  if(e.target.id==="financeTo"){filters.finance.to=e.target.value;render();}
  if(e.target.id==="financeType"){filters.finance.type=e.target.value;render();}
  if(e.target.id==="reportFrom"){filters.reports.from=e.target.value;render();}
  if(e.target.id==="reportTo"){filters.reports.to=e.target.value;render();}
  if(e.target.id==="setting_printerWidth"){state.settings.printerWidth=e.target.value;saveState();}
});
document.addEventListener("keyup",e=>{
  const tag=(document.activeElement?.tagName||"").toLowerCase();
  const typing=["input","textarea","select"].includes(tag);
  if(e.key==="Escape"){closeModal();return;}
  if(e.ctrlKey && e.key.toLowerCase()==="f"){e.preventDefault();document.getElementById("globalSearch")?.focus();return;}
  if(e.ctrlKey && e.key.toLowerCase()==="k"){e.preventDefault();openCommandPalette();return;}
  if(e.ctrlKey && e.key.toLowerCase()==="n" && !typing){e.preventDefault();openDeviceForm();return;}
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==="c" && !typing){e.preventDefault();openCustomerForm();return;}
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==="p" && !typing){e.preventDefault();openPartForm();return;}
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==="s" && !typing){e.preventDefault();openSupplierForm();return;}
  if(e.ctrlKey && e.key.toLowerCase()==="p"){e.preventDefault();window.print();return;}
  if(e.ctrlKey && !e.shiftKey && /^[1-8]$/.test(e.key) && !typing){e.preventDefault();navigate(navItems()[Number(e.key)-1][0]);return;}
  if(!typing && currentPage==="devices"){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Enter"||e.key==="Delete"){
      handleTableKey("devices",state.devices.filter(d=>{
        const f=filters.devices,q=f.search;
        return textSearch(d,q)&&(f.status==="all"||d.status===f.status)&&(f.type==="all"||d.type===f.type)&&(!f.from||(d.receivedDate||"")>=f.from)&&(!f.to||(d.receivedDate||"")<=f.to);
      }),e);return;
    }
  }
  if(!typing && currentPage==="customers" && ["ArrowDown","ArrowUp","Enter","Delete"].includes(e.key)){
    handleTableKey("customers",state.customers.filter(c=>textSearch(c,filters.customers.search)&&(filters.customers.level==="all"||c.level===filters.customers.level)),e);return;
  }
  if(!typing && currentPage==="parts" && ["ArrowDown","ArrowUp","Enter","Delete"].includes(e.key)){
    handleTableKey("parts",state.parts.filter(p=>textSearch(p,filters.parts.search)),e);return;
  }
  if(!typing && currentPage==="suppliers" && ["ArrowDown","ArrowUp","Enter","Delete"].includes(e.key)){
    handleTableKey("suppliers",state.suppliers.filter(s=>textSearch(s,filters.suppliers.search)),e);return;
  }
  if(!typing && currentPage==="finance" && ["ArrowDown","ArrowUp","Delete"].includes(e.key)){
    const f=filters.finance; const rows=state.transactions.filter(t=>(!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)&&(f.type==="all"||t.type===f.type)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    handleTableKey("transactions",rows,e);
  }
});
function handleTableKey(key,rows,e){
  if(e.key==="ArrowDown"){e.preventDefault();selected[key]=Math.min((selected[key]??-1)+1,rows.length-1);render();scrollSelected();}
  if(e.key==="ArrowUp"){e.preventDefault();selected[key]=Math.max((selected[key]??0)-1,0);render();scrollSelected();}
  if(e.key==="Enter"){e.preventDefault();const row=rows[selected[key]];if(!row)return; if(key==="devices")openDeviceForm(row.id); if(key==="customers")openCustomerForm(row.id); if(key==="parts")openPartForm(row.id); if(key==="suppliers")openSupplierForm(row.id);}
  if(e.key==="Delete"){e.preventDefault();const row=rows[selected[key]];if(!row)return; if(key==="devices")deleteDevice(row.id); if(key==="customers")deleteCustomer(row.id); if(key==="parts")deletePart(row.id); if(key==="suppliers")deleteSupplier(row.id); if(key==="transactions")deleteTransaction(row.id);}
}
function scrollSelected(){
  const row=document.querySelector("tbody tr.selected");row?.scrollIntoView({block:"nearest"});
}

document.addEventListener("input",e=>{
  if(e.target.id==="barcodeQuick"){
    const code=e.target.value.trim();
    if(e.inputType==="insertText" && code.length>8) filters.parts.search=code;
  }
});
document.addEventListener("keydown",e=>{
  if(e.target?.id==="barcodeQuick"&&e.key==="Enter"){
    e.preventDefault();
    const code=e.target.value.trim(); if(!code)return;
    const p=state.parts.find(x=>x.barcode===code);
    if(p){filters.parts.search=code;toast(`تم العثور على القطعة: ${p.name}`);render();}
    else toast("الباركود غير موجود في المخزون","err");
  }
});

document.addEventListener("click",e=>{
  if(e.target.id==="saveSettings"){
    const ids=["businessName","businessPhone","businessWhatsApp","businessAddress","currency","warrantyDefault","invoiceFooter"];
    ids.forEach(id=>{
      const el=document.getElementById("setting_"+id);
      if(el) state.settings[id]=id==="warrantyDefault"?safeNum(el.value):el.value.trim();
    });
    saveState();render();toast("تم حفظ الإعدادات");
  }
  if(e.target.id==="printReport"){window.print();}
  if(e.target.id==="clearReport"){filters.reports={from:"",to:""};render();}
  if(e.target.id==="restoreFile"){ /* input is clicked through label/action */ }
});
document.addEventListener("change",e=>{
  if(e.target.id==="restoreFile"){
    const f=e.target.files?.[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const parsed=JSON.parse(r.result);
        if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.devices)||!Array.isArray(parsed.customers)) throw new Error("invalid");
        if(!confirmAction("استعادة النسخة الاحتياطية ستستبدل البيانات الحالية. متابعة؟"))return;
        state={...structuredClone(defaultState),...parsed,settings:{...defaultState.settings,...(parsed.settings||{})}};
        saveState();render();toast("تمت استعادة النسخة الاحتياطية");
      }catch(err){toast("ملف النسخة الاحتياطية غير صالح","err");}
    };
    r.readAsText(f);
  }
});

window.printDocument=printDocument;

render();
})();
</script>
